<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUSH — The Seeker</title>
<style>html,body{margin:0;background:#0c1110;color:#d3cec0;font-family:Georgia,serif;overflow:hidden}canvas{display:block}header{position:fixed;top:28px;left:32px;pointer-events:none}h1{font-size:26px;letter-spacing:.15em;font-weight:400;margin:0}p{font:11px/1.8 monospace;letter-spacing:.12em;opacity:.7}nav{position:fixed;bottom:24px;left:24px;right:24px;display:flex;gap:8px;flex-wrap:wrap}button{font:11px monospace;letter-spacing:.08em;color:inherit;background:#101613d9;border:1px solid #62665b;padding:13px 16px;cursor:pointer}button[aria-pressed=true]{background:#d3cec0;color:#101613}#status{position:fixed;right:28px;top:27px;max-width:40%;text-align:right}</style></head>
<body><header><h1>THE SEEKER</h1><p>HUSH · CHARACTER PREVIEW</p></header><p id="status">Loading…</p><canvas aria-label="Animated Seeker model"></canvas>
<nav><button data-mode="still" aria-pressed="true">Listen</button><button data-mode="walk" aria-pressed="false">Walk</button><button data-mode="approach" aria-pressed="false">Approach & scream</button><button data-view="full" aria-pressed="true">Full body</button><button data-view="face" aria-pressed="false">Face</button><button data-view="side" aria-pressed="false">Side</button><label style="font:12px monospace;align-self:center">Distance <span id="distance-value">8.0 m</span> <input id="distance" aria-label="Distance from the Seeker" type="range" min="1.3" max="10" step="0.1" value="8"></label><button id="sound" aria-pressed="false">Enable scream audio</button><button id="reduced" aria-pressed="false">Reduce motion</button></nav>
<script type="module" src="/tools/seeker-preview.js"></script></body></html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c0a" />
    <title>HUSH — It remembers where you hide.</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%230b0c0a'/%3E%3Ctext x='18' y='60' fill='%23e8e4d8' font-size='60' font-family='serif'%3EH%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="world" aria-label="First-person view of the house"></canvas>
    <div id="vignette"></div>
    <div id="grain"></div>
    <section id="menu" class="screen">
      <div class="clock">2:17 AM</div>
      <div class="menu-content">
        <h1>HUSH</h1>
        <p class="tagline">It remembers where you hide.</p>
        <button id="start" class="primary">Enter the house</button>
        <p class="headphones">Headphones recommended.</p>
        <button id="menu-settings" class="text-button">
          Settings & controls
        </button>
      </div>
      <footer>
        <span class="mono"
          >WASD&nbsp; MOVE &nbsp; MOUSE&nbsp; LOOK &nbsp; E&nbsp; INTERACT</span
        ><i>Someone always has to be hiding.</i>
      </footer>
    </section>
    <div id="hud" hidden>
      <header>
        <div>
          <span id="location">The foyer</span
          ><small id="objective"
            >Find the five memories. Find your sister.</small
          >
        </div>
        <button id="pause-button" aria-label="Pause game">Ⅱ</button>
        <div class="hud-right">
          <span id="time">2:17 AM</span
          ><small id="memories">MEMORIES &nbsp; 0 / 5</small>
        </div>
      </header>
      <div id="phase">
        <span id="phase-label"></span><strong id="countdown"></strong>
      </div>
      <div id="reticle"></div>
      <div id="prompt"></div>
      <div id="subtitle" role="status"></div>
      <div id="breath">
        <span id="breath-label">BREATH</span>
        <div><b id="breath-fill"></b></div>
        <small id="hide-label"></small>
      </div>
      <div id="hud-bottom">
        <span id="light-label">F &nbsp; LIGHT ON</span
        ><span class="desktop-hints"
          >SHIFT &nbsp; RUN &nbsp; C &nbsp; CROUCH &nbsp; SPACE &nbsp; HOLD
          BREATH &nbsp; Q &nbsp; DISTRACT</span
        ><button id="journal-button">J &nbsp; MEMORIES / MAP</button>
      </div>
    </div>
    <div id="touch" hidden>
      <div id="stick" role="group" aria-label="Movement joystick">
        <span></span>
      </div>
      <div id="look-pad" role="group" aria-label="Drag to look"></div>
      <div class="touch-actions">
        <button data-action="KeyE" aria-label="Interact">Use</button
        ><button data-action="KeyF">Light</button
        ><button data-hold="Space" aria-label="Hold breath">Hush</button
        ><button data-hold="ShiftLeft" aria-label="Hold to run">Run</button
        ><button data-action="KeyQ">Throw</button
        ><button data-action="KeyC" aria-pressed="false">Crouch</button>
      </div>
    </div>
    <div id="modal" class="modal" hidden>
      <section
        class="dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-title"
      >
        <p id="dialog-kicker" class="mono"></p>
        <h2 id="dialog-title"></h2>
        <div id="dialog-body"></div>
        <div id="dialog-actions"></div>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
